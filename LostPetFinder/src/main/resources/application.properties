# ==========================================
# LostPetFinder - Database Configuration
# ==========================================

spring.application.name=LostPetFinder

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/lostpetfinder
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080